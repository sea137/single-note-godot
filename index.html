<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4ed"><meta name="apple-mobile-web-app-capable" content="yes">
<title>单音 · 听音练习</title><meta name="description" content="每天几分钟，用钢琴单音练习你的音高辨识。">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header><a class="brand" href="./"><span class="brand-icon">♩</span> 单音 <span class="brand-en">PITCH PRACTICE</span></a><span class="pill">钢琴音色</span></header>
<section id="setup">
<div class="intro"><span class="eyebrow">每天一点，听见进步</span><h1>听一个音，<br>认识它的名字。</h1><p>轻点播放，听一颗钢琴音。<br>凭听觉选出音名，慢慢建立你的音高记忆。</p></div>
<div class="card">
<label for="preset">练习哪些音？</label><select id="preset"><option value="simple">入门 · C、D、E</option><option value="advanced">进阶 · C、D、E、F、G</option><option value="natural">自然音 · C、D、E、F、G、A、B</option><option value="all">全部 · 12 个半音</option></select>
<div class="note-preview" id="preview"></div>
<label for="limit">这次练多少题？</label><div class="number-row"><input id="limit" type="number" inputmode="numeric" min="0" max="999" step="1" value="0"><span>0 = 自由练习，无题数限制</span></div>
<details><summary>更多设置 <span>＋</span></summary><div class="advanced"><label class="switch-row" for="auto">答对后自动下一题<input type="checkbox" id="auto"></label><label for="octave">音高范围</label><select id="octave"><option value="mixed">随机八度 · C3–B5</option><option value="3">低音区 · 第 3 八度</option><option value="4">中音区 · 第 4 八度</option><option value="5">高音区 · 第 5 八度</option></select><label for="volume">音量 <span id="volume-label">70%</span></label><input id="volume" type="range" min="0" max="100" value="70"></div></details>
<button id="start" class="primary">开始练习 <span>→</span></button><p class="hint">第一题会在开始后播放，请先调整手机音量。</p>
<a href="https://single-note-practice.zippyhake16.chatgpt.site/android/" style="display:block;text-align:center;color:#284e3e;font-size:13px;margin-top:20px">下载安卓离线 App ↓</a>
</div>
</section>
<section id="practice" hidden>
<div class="session-top"><span id="progress">第 1 题</span><button id="finish" class="text-button">结束练习</button></div>
<div class="stats"><div><b id="correct">0</b><span>首答正确</span></div><div><b id="attempts">0</b><span>已作答</span></div><div><b id="accuracy">—</b><span>正确率</span></div></div>
<div class="listen"><span class="eyebrow">专注这一颗音</span><h1>你听到的是？</h1><button id="replay" class="play" aria-label="重听当前音符"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M19 12v24l20-12z" fill="currentColor"/></svg></button><p>轻点重听，不限次数</p></div>
<div id="choices" class="choices" aria-label="选择音名"></div><div id="feedback" class="feedback" role="status" aria-live="polite">听完后，选一个音名。</div><button id="next" class="primary">跳过，下一题 →</button>
</section>
<section id="result" hidden><div class="intro"><span class="eyebrow">每一次聆听，都是积累</span><h1>今天又进步了一点。</h1><p id="result-text"></p></div><div class="card"><div class="result-score"><b id="result-score">0%</b><span>首答正确率</span></div><div id="breakdown"></div><button id="restart" class="primary">再练一组 →</button><button id="settings" class="secondary">调整练习设置</button></div></section>
<div id="error" role="alert" hidden></div>
<footer>只听一个音，只专注此刻。<small>钢琴采样来源 <a href="https://tonedear.com/ear-training/absolute-perfect-pitch-test" target="_blank" rel="noopener">TonedEar</a></small></footer>
</main><script src="app.js"></script>
</body></html>
